<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waypoints Tools</title>
  <style>
    :root { --bg: #f6f7f9; --panel: #fff; --text: #1c2430; --muted: #5b6676; --line: #dde2e8; --accent: #2f6fdd; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111418; --panel: #1a1f26; --text: #e7ebf0; --muted: #9aa5b3; --line: #2c333d; --accent: #6c9cf0; } }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
    h1 { margin: 0 0 4px; }
    p { color: var(--muted); margin: 0 0 20px; }
    a.tool { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; color: inherit; text-decoration: none; }
    a.tool:hover, a.tool:focus-visible { border-color: var(--accent); }
    a.tool strong { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Waypoints Tools</h1>
    <p>Small browser tools for the classroom. Everything runs on your own computer.</p>
    <a class="tool" href="trainer/"><strong>Pattern Trainer</strong><br>Teach a computer to sort pictures into your own groups, then download the model for your Python app.</a>
  </main>
</body>
</html>
