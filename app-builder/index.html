<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Builder (prototype)</title>
<style>:root {
  --bg: #f4f5f8; --panel: #fff; --line: #e1e4ea; --ink: #1c2333; --muted: #6b7385;
  --accent: #3563e9; --accent-ink: #fff; --accent-soft: #e8eefd;
  --trig: #b7791f; --trig-soft: #fff6e0; --else: #7c3aed; --else-soft: #f1eafe;
  --ok: #d7f5e1; --bad: #c0392b; --bad-soft: #fdecea;
  --radius: 10px;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color: var(--ink);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .4; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; }
h3 small { text-transform: none; letter-spacing: 0; font-weight: 400; }
h4 { font-size: 13px; margin: 18px 0 6px; }
.muted { color: var(--muted); font-size: 13px; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 10px; }

/* shell */
#app { display: grid; grid-template-columns: 250px 1fr; grid-template-rows: auto 1fr; height: 100vh; }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-size: 15px; }
.tag { margin-left: 8px; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.spacer { flex: 1; }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.side { background: var(--panel); border-right: 1px solid var(--line); padding: 6px 14px 20px; overflow-y: auto; }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.tabs { display: flex; gap: 4px; padding: 10px 16px 0; border-bottom: 1px solid var(--line); background: var(--panel); }
.tab { border: 0; background: none; padding: 9px 16px; border-bottom: 3px solid transparent; font-weight: 600; color: var(--muted); }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.view { flex: 1; min-height: 0; overflow: auto; padding: 18px; }
.view[hidden] { display: none; }
.view-design, .view-run { display: flex; gap: 24px; align-items: flex-start; }

/* controls */
.btn { white-space: nowrap; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; }
.btn:hover:not(:disabled) { background: #f0f2f7; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: #2a52c9; }
.btn.danger { color: var(--bad); }
.icon { border: 1px solid transparent; background: none; border-radius: 6px; min-width: 28px; height: 28px; padding: 0 6px; color: var(--muted); }
.icon:hover:not(:disabled) { background: #eceff5; color: var(--ink); }
.icon.danger:hover:not(:disabled) { background: var(--bad-soft); color: var(--bad); }
.link { border: 0; background: none; padding: 5px 4px; text-align: left; width: 100%; border-radius: 6px; }
.link:hover { background: #f0f2f7; }
.ctl { font: inherit; border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; background: #fff; min-width: 0; color: var(--ink); }
.ctl:focus-visible, .btn:focus-visible, .icon:focus-visible, .chip:focus-visible, .link:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ctl.small { width: 72px; }
.props .var .ctl.small { width: 130px; }
.ctl.name { width: 220px; font-weight: 600; }
.ctl.bad { border-color: var(--bad); background: var(--bad-soft); }

/* side */
.row { display: flex; align-items: center; gap: 4px; margin-bottom: 2px; }
.row.on .ctl { flex: 1; font-weight: 600; border-color: var(--accent); }
.add-row { display: flex; gap: 6px; margin: 8px 0; }
.add-row .ctl:first-child { flex: 1; }
.add-kinds { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.obj { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid #f0f1f5; align-items: baseline; }
.kind { font-size: 11px; color: var(--muted); width: 58px; flex: none; }
.obj-main { flex: 1; min-width: 0; }
.chips { display: flex; gap: 4px; margin-top: 3px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 6px; min-width: 26px; height: 24px; font-size: 12px; padding: 0 6px; }
.chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.var { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
.legal { margin-top: 28px; font-size: 12px; }
.vname { flex: 1; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
.val { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }

/* design */
.stage-col { flex: none; }
.screen-title { font-weight: 600; margin: 0 0 8px 2px; }
.stage { position: relative; background: #fff; border: 1px solid #cfd4de; border-radius: 28px; box-shadow: 0 10px 30px rgba(20, 30, 60, .12); overflow: hidden; outline: none; }
.stage.design { background-image: radial-gradient(#e6e9f0 1px, transparent 1px); background-size: 16px 16px; touch-action: none; }
.w { position: absolute; }
.w > * { width: 100%; height: 100%; }
.w-button > button { border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-family: inherit; font-weight: 600; font-size: 16px; line-height: 1.1; padding: 4px 10px; }
.w-button > button:active { filter: brightness(.9); }
.w-text > .t { display: flex; align-items: center; font-size: 17px; white-space: pre-wrap; overflow: hidden; }
.w-input > input { border: 1px solid #b9c0cf; border-radius: 10px; padding: 0 12px; font-family: inherit; font-size: 16px; }
.w.hidden { display: none; }
.design .w { cursor: move; user-select: none; }
.design .w > * { pointer-events: none; }
.design .w.hidden { display: block; opacity: .35; }
.design .w.sel { outline: 2px solid var(--accent); outline-offset: 2px; }
.design .w:not(.sel):hover { outline: 1px dashed #9aa6c4; outline-offset: 2px; }
.handle { position: absolute; right: -6px; bottom: -6px; width: 14px; height: 14px; border-radius: 4px; background: var(--accent); border: 2px solid #fff; cursor: nwse-resize; pointer-events: auto !important; }
.props { flex: 1; max-width: 360px; min-width: 260px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 16px 16px; }
.props h3:first-child { margin-top: 12px; font-size: 14px; text-transform: none; letter-spacing: 0; color: var(--ink); }
.f { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.f.wide { margin: 8px 0; }
.f.check { flex-direction: row; align-items: center; gap: 8px; margin: 10px 0 0; color: var(--ink); font-size: 14px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grid4 .ctl.small { width: 100%; }
.btn-row { display: flex; gap: 8px; margin-top: 16px; }

/* event sheet */
.es { max-width: 1100px; }
.es-empty { color: var(--muted); }
.ev { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin: 8px 0; transition: background .45s, border-color .45s; }
.ev.ran { background: var(--ok); border-color: #6cc48a; transition: none; }
.ev.else { border-left: 4px solid var(--else); }
.ev.bad { border-color: var(--bad); }
.ev-main { display: grid; grid-template-columns: minmax(240px, 1fr) minmax(280px, 1.3fr) auto; gap: 14px; padding: 10px 12px; align-items: start; }
.ro .ev-main { grid-template-columns: minmax(180px, 1fr) minmax(200px, 1.3fr); }
.ev-conds, .ev-acts { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.ev-conds { border-right: 1px dashed var(--line); padding-right: 12px; }
.item { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; max-width: 100%; }
.item.cond.trig { background: var(--trig-soft); border-radius: 8px; padding: 3px 8px; margin-left: -8px; }
.item.bad { color: var(--bad); }
.bolt { color: var(--trig); }
.x { border: 0; background: none; color: var(--muted); border-radius: 5px; width: 22px; height: 22px; line-height: 1; opacity: .5; }
.item:hover .x { opacity: 1; }
.x:hover { background: var(--bad-soft); color: var(--bad); }
.badge { background: var(--else-soft); color: var(--else); font-weight: 700; font-size: 12px; padding: 2px 9px; border-radius: 99px; }
.mini { border: 1px dashed #b7bfd0; background: none; border-radius: 7px; padding: 3px 10px; font-size: 12px; color: var(--muted); }
.mini:hover { border-color: var(--accent); color: var(--accent); }
.ctl.expr { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; background: #fafbfd; max-width: 100%; }
select.ctl { padding-right: 4px; }
.ev-tools { display: flex; gap: 2px; }
.ev-children { margin: 0 12px 10px 28px; padding-left: 12px; border-left: 2px solid var(--line); }
.ev-warn { font-size: 12px; color: var(--bad); padding: 0 12px 8px; }
.es-addev { margin-top: 6px; }
.val.bad { color: var(--bad); }
.val.expr { background: #f3f4f8; border-radius: 6px; padding: 1px 6px; }

/* add menu */
.es-overlay { position: fixed; inset: 0; background: rgba(20, 25, 40, .35); display: flex; align-items: flex-start; justify-content: center; padding-top: 10vh; z-index: 10; }
.es-menu { background: #fff; border-radius: 14px; width: min(520px, 92vw); max-height: 76vh; overflow: auto; padding: 14px 16px 16px; box-shadow: 0 20px 50px rgba(0, 0, 0, .25); }
.es-menu-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.es-menu .ctl { width: 100%; }
.es-cat { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 4px; }
.es-entry { display: flex; flex-direction: column; align-items: flex-start; width: 100%; border: 0; background: none; text-align: left; padding: 7px 8px; border-radius: 8px; }
.es-entry:hover:not(:disabled) { background: var(--accent-soft); }
.es-entry small { color: var(--muted); font-size: 12px; }

/* run */
.run-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; min-height: 30px; max-width: 390px; }
.run-side { flex: 1; min-width: 300px; max-width: 760px; }
.run-side h3:first-child { margin-top: 0; }
.watch { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 2px 14px 10px; }
.problems { margin-top: 10px; }
.problems h3 { color: var(--bad); }
.problem { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 6px 10px; margin: 4px 0; font-size: 13px; }

@media (max-width: 600px) {
  #app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; height: auto; min-height: 100vh; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); max-height: 40vh; }
}
@media (max-width: 900px) {
  .view-design, .view-run { flex-direction: column; }
  .ev-main { grid-template-columns: 1fr; }
  .ev-conds { border-right: 0; border-bottom: 1px dashed var(--line); padding: 0 0 8px; }
}
@media (prefers-reduced-motion: reduce) { .ev { transition: none; } }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1c2333; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: min(520px, 90vw); z-index: 20; box-shadow: 0 8px 24px rgba(0,0,0,.25); }

/* project tree */
.tree-row { display: flex; align-items: center; gap: 6px; }
.tree-row.screen { margin: 2px 0; }
.tree-row.screen.on .ctl { flex: 1; font-weight: 600; border-color: var(--accent); }
.caret { color: var(--muted); font-size: 12px; width: 12px; }
.tree-children { margin: 2px 0 8px 5px; padding-left: 10px; border-left: 2px solid var(--line); }
.tree-row.obj { align-items: baseline; padding: 6px 0; border-bottom: 1px solid #f0f1f5; }
.tree-row.obj:last-of-type { border-bottom: 0; }

/* events tab: sheet + live preview */
.view-events { display: flex; gap: 20px; align-items: flex-start; }
.sheet-col { flex: 1; min-width: 0; container-type: inline-size; }
.preview-col { flex: none; width: min(48%, 560px); position: sticky; top: 0; }
.preview-col .run-bar { max-width: none; justify-content: space-between; }
.check-inline { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.pick-banner { background: var(--accent); color: #fff; border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 8px; }
.pick-banner[hidden] { display: none; }
.pickwrap { display: inline-flex; align-items: center; gap: 2px; }
.icon.pick { color: var(--accent); }
.stage.picking { box-shadow: 0 0 0 4px var(--accent); }
.stage.picking .w { cursor: crosshair; }
.stage.picking .w:hover { outline: 2px solid var(--accent); outline-offset: 2px; }
@container (max-width: 720px) {
  .ev-main { grid-template-columns: minmax(140px, 1fr) minmax(170px, 1.3fr); }
  .ev-tools { grid-column: 1 / -1; justify-content: flex-end; }
  .ev-children { margin-left: 14px; }
}
@media (max-width: 1100px) { .view-events { flex-direction: column; align-items: stretch; } .preview-col { position: static; width: 100%; } }

/* guided event view */
.sheet-bar { display: flex; align-items: center; gap: 12px; justify-content: space-between; margin-bottom: 8px; }
.sheet-bar .hint { margin: 0; }
.seg { font: inherit; font-size: 12px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 99px; background: #fff; color: var(--muted); cursor: pointer; white-space: nowrap; }
.seg:hover { border-color: var(--accent); color: var(--accent); }
.which-sheet { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.which-sheet[hidden] { display: none; }
.seg.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.tree-row.all-screens .kind { margin-left: 8px; }
.tree-row.all-screens.on .link { font-weight: 600; color: var(--accent); }
.tag.lvl { margin-left: 0; }
.dbg { margin-top: 8px; font-size: 13px; }
.dbg summary { cursor: pointer; color: var(--muted); }
.es.guided .ev { cursor: pointer; border: 2px solid transparent; }
.es.guided .ev:hover { border-color: #dfe3ee; }
.es.guided .ev.sel { border-color: var(--accent); }
.es.guided .ev:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.item.guided { font: inherit; text-align: left; cursor: pointer; border: 1px solid transparent; background: var(--accent-soft, #eef2ff); border-radius: 8px; padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 4px; align-items: baseline; }
button.item.guided:hover { border-color: var(--accent); }
button.item.guided .val { font-weight: 600; }
button.item.guided .val.bad { color: #b3261e; }
.mini { font: inherit; font-size: 12px; padding: 3px 8px; border: 1px dashed #b7bdcc; border-radius: 99px; background: transparent; color: var(--muted); cursor: pointer; }
.mini:hover { border-color: var(--accent); color: var(--accent); }
.popmenu { position: fixed; z-index: 1000; min-width: 200px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(20, 30, 60, .18); padding: 4px; display: flex; flex-direction: column; }
.pm-item { font: inherit; text-align: left; padding: 8px 10px; border: 0; background: none; border-radius: 6px; cursor: pointer; }
.pm-item:hover:not(:disabled) { background: #f2f4fa; }
.pm-item:disabled { color: #aab; cursor: default; }
.pm-item.danger { color: #b3261e; }

/* dialogs */
.es-dlg { border: 0; border-radius: 14px; padding: 0; width: min(520px, 92vw); max-height: 85vh; box-shadow: 0 20px 60px rgba(20, 30, 60, .3); }
.es-dlg::backdrop { background: rgba(20, 25, 45, .45); }
.es-dlg[open] { display: flex; flex-direction: column; }
.dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.dlg-body { padding: 14px 16px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.dlg-foot { display: flex; gap: 8px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.dlg-foot .spacer { flex: 1; }
.es-list { display: flex; flex-direction: column; gap: 4px; }
.es-cat { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-top: 8px; }
.es-entry { font: inherit; text-align: left; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; display: flex; flex-direction: column; }
.es-entry:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft, #eef2ff); }
.es-entry:disabled { color: #99a; cursor: not-allowed; background: #fafbfd; }
.es-entry small { color: #b3261e; }
.es-sentence { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 16px; padding: 12px; background: #f7f8fc; border-radius: 10px; }
.es-errs p { margin: 2px 0; color: #b3261e; font-size: 13px; }
.es-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font: inherit; font-size: 12px; padding: 2px 9px; border: 1px solid var(--line); border-radius: 99px; background: #fff; cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* ---- polish pass ---- */
:root { --line: #dfe3ec; --line-strong: #cdd3e0; --shadow-sm: 0 1px 2px rgba(20, 30, 60, .06); --ok: #eaf8ef; }
body { -webkit-font-smoothing: antialiased; }
.top { box-shadow: var(--shadow-sm); position: relative; z-index: 2; }
.brand { letter-spacing: -.01em; }
.tab { transition: color .15s, border-color .15s; border-radius: 6px 6px 0 0; }
.tab:hover:not(.on) { color: var(--ink); background: #f4f6fb; }
.btn { box-shadow: var(--shadow-sm); transition: background .15s, border-color .15s, box-shadow .15s; border-color: var(--line-strong); }
.btn:hover:not(:disabled) { border-color: #b9c1d3; }
.btn.primary { border-color: var(--accent); box-shadow: 0 1px 2px rgba(53, 99, 233, .35); }
.btn.danger:hover:not(:disabled) { background: var(--bad-soft); border-color: #e7b4ae; }

/* text boxes: light, subtle border; clear focus ring */
.ctl { border-color: var(--line-strong); background: #fff; box-shadow: inset 0 1px 2px rgba(20, 30, 60, .04); transition: border-color .15s, box-shadow .15s; }
.ctl:hover { border-color: #b4bccd; }
.ctl:focus, .ctl:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ctl.bad { border-color: var(--bad); background: var(--bad-soft); }
.ctl.bad:focus { box-shadow: 0 0 0 3px #f6d5d1; }
select.ctl { padding-right: 6px; }
.btn:focus-visible, .icon:focus-visible, .chip:focus-visible, .link:focus-visible, .tab:focus-visible, .obj-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* the app on the stage */
.stage { border-color: var(--line-strong); }
.w-input > input { border: 1px solid #d3d9e6; background: #fff; box-shadow: inset 0 1px 2px rgba(20, 30, 60, .06); border-radius: 10px; color: var(--ink); transition: border-color .15s, box-shadow .15s; }
.w-input > input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.w-button > button { box-shadow: 0 1px 2px rgba(20, 30, 60, .18); transition: filter .12s, transform .06s; }
.w-button > button:hover { filter: brightness(1.06); }
.w-button > button:active { transform: translateY(1px); filter: brightness(.92); }
.w-text > .t { padding: 0 2px; line-height: 1.25; }
.design .w-text { outline: 1px dashed #d5dbe8; outline-offset: 1px; border-radius: 6px; }
.design .w.sel { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* side tree: compact rows */
.tree-row.obj { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0; border-bottom: 0; border-radius: 8px; margin: 1px 0; }
.tree-row.obj.on { background: var(--accent-soft); }
.obj-btn { flex: 1; min-width: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; border: 0; background: none; text-align: left; padding: 6px 8px; border-radius: 8px; }
.obj-btn:hover { background: #f0f2f8; }
.tree-row.obj.on .obj-btn:hover { background: transparent; }
.obj-name { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-row.obj .kind { width: auto; font-size: 11px; color: var(--muted); flex: none; }
.tree-row.obj .chips { margin: 0 4px 0 0; flex: none; }
.tree-children { margin: 2px 0 10px 7px; padding-left: 8px; }
.add-kinds .btn { font-size: 13px; padding: 5px 10px; }
.side h3 { margin-top: 20px; }

/* cards */
.props, .ev, .watch { box-shadow: var(--shadow-sm); }
.ev { border-color: var(--line); }
.ev.ran { background: var(--ok); border-color: #8fd1a8; }
.es.guided .ev { border: 1px solid var(--line); }
.es.guided .ev:hover { border-color: #c3cbe0; }
.es.guided .ev.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.run-bar { flex-wrap: wrap; }
.props h3 small { color: var(--muted); }
.design .w.sel { z-index: 5; }

/* match the Waypoints tools site palette */
:root { --bg: #f6f7f9; --line: #dde2e8; --line-strong: #cbd2dc; --ink: #1c2430; --muted: #5b6676; --accent: #2f6fdd; --accent-soft: #e6eefb; }
.btn.primary:hover { background: #2760c4; }
.btn.primary { box-shadow: 0 1px 2px rgba(47, 111, 221, .35); }

.caret { border: 0; background: none; padding: 2px 4px; border-radius: 4px; cursor: pointer; color: var(--muted); }
.caret:hover { background: #eceff5; color: var(--ink); }

/* hide until needed: more buttons, deletes */
.tree-row.screen.on { align-items: center; }
.screen-name { flex: 1; font-weight: 600; padding: 4px 6px; border-radius: 6px; border: 1px solid transparent; cursor: default; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-row.screen.on .ctl { font-weight: 600; flex: 1; }
.icon.more { flex: none; }
.add-obj, .add-screen { margin-top: 6px; font-size: 13px; }
.add-screen { margin: 6px 0 0; }
.var .icon.danger { opacity: 0; transition: opacity .12s; }
.var:hover .icon.danger, .var:focus-within .icon.danger { opacity: 1; }
.props .var .icon.danger { opacity: 0; }
.props .var:hover .icon.danger, .props .var:focus-within .icon.danger { opacity: 1; }
@media (hover: none) { .var .icon.danger, .props .var .icon.danger { opacity: 1; } }

/* object picker */
.op { display: flex; flex-direction: column; gap: 8px; }
.op-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.op-tile { font: inherit; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding: 14px 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; cursor: pointer; transition: border-color .12s, box-shadow .12s, background .12s; }
.op-tile:hover { border-color: var(--accent); background: var(--accent-soft); }
.op-tile:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.op-icon { color: var(--accent); display: flex; }
.op-tile small { color: var(--muted); font-size: 12px; line-height: 1.3; }

/* choose-between-two-values builder */
.cb-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cb-row .lbl { min-width: 92px; color: var(--muted); }
.cb-preview { padding: 8px 10px; background: #f7f8fc; border-radius: 8px; font-size: 13px; overflow-wrap: anywhere; }
.cb-code { font-family: ui-monospace, Menlo, Consolas, monospace; }
.choice-btn { font-size: 13px; padding: 4px 10px; margin-left: auto; }

/* toggle + slider on the stage */
.w-toggle > .tg { display: flex; align-items: center; gap: 10px; font-size: 16px; cursor: pointer; user-select: none; }
.tg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.tg-track { flex: none; width: 46px; height: 26px; border-radius: 99px; background: #cdd3de; position: relative; transition: background .15s; }
.tg-track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(20, 30, 60, .3); transition: transform .15s; }
.tg input:checked + .tg-track { background: var(--accent); }
.tg input:checked + .tg-track::after { transform: translateX(20px); }
.tg input:focus-visible + .tg-track { box-shadow: 0 0 0 3px var(--accent-soft); }
.w-slider > input[type=range] { accent-color: var(--accent); margin: 0; cursor: pointer; }
.stage:not(.design):focus { outline: none; }
.stage.kb-focus:not(.design) { box-shadow: 0 0 0 3px var(--accent-soft), 0 10px 30px rgba(20, 30, 60, .12); }
.kb-hint { margin: 8px 2px 0; font-size: 12px; color: var(--muted); }
.stage.kb-focus ~ .kb-hint { display: none; }
.kb-hint[hidden] { display: none; }
.es-entry small.help { color: var(--muted); font-size: 12px; margin-top: 2px; }

/* event chooser: grid first */
.op-grid.small { grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 8px; }
.op-tile.small { padding: 10px 6px 8px; gap: 2px; }
.op-tile.small .op-icon svg { width: 32px; height: 32px; }
.op-tile.small strong { font-size: 13px; overflow-wrap: anywhere; }
.op-tile.small small { font-size: 11px; }
.mini.back { align-self: flex-start; margin-bottom: 4px; }

/* expression boxes in dialogs: wide, coloured like Construct */
.es-sentence .hl { position: relative; display: inline-flex; flex: 1 1 280px; min-width: 200px; }
.hl > input.ctl.expr { position: relative; width: 100%; background: transparent; color: transparent; caret-color: var(--ink); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; padding: 7px 10px; }
.hl > input.ctl.expr::placeholder { color: #9aa3b5; }
.hl > input.ctl.expr::selection { background: rgba(47, 111, 221, .25); color: transparent; }
.hl > input.ctl.expr.bad { background: transparent; }
.hl.bad, .hl:has(input.bad) { background: var(--bad-soft); border-radius: 7px; }
.hl-mirror { position: absolute; inset: 0; padding: 8px 11px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; white-space: pre; overflow: hidden; pointer-events: none; color: var(--ink); line-height: normal; display: flex; align-items: center; }
.hl-str { color: #b42318; } .hl-num { color: #0b7a4b; } .hl-op { color: #2f6fdd; font-weight: 600; } .hl-fn { color: #7c3aed; } .hl-name { color: #1d3a8a; }
.es-helps { display: flex; flex-direction: column; gap: 2px; }
.es-help { margin: 0; font-size: 13px; color: var(--muted); }
.find-btn { font-size: 13px; padding: 4px 10px; }
/* expression browser */
.xb { display: flex; flex-direction: column; gap: 4px; }
.xb-item { font: inherit; display: grid; grid-template-columns: minmax(120px, auto) 1fr; gap: 2px 12px; text-align: left; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; }
.xb-item:hover { border-color: var(--accent); background: var(--accent-soft); }
.xb-item code { font-family: ui-monospace, Menlo, Consolas, monospace; color: #1d3a8a; font-size: 13px; }
.xb-desc { font-size: 13px; }
.xb-item small { grid-column: 2; color: var(--muted); font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; }

.es-preview { margin: 0; font-size: 13px; padding: 6px 10px; background: #f2f8f4; border-radius: 7px; }
.es-preview code { font-family: ui-monospace, Menlo, Consolas, monospace; color: #0b5c38; white-space: pre-wrap; }
.es-preview.warn { background: #fff6e0; color: #8a5a00; }

.link-name { border: 0; background: none; padding: 3px 4px; margin-left: -4px; text-align: left; border-radius: 5px; cursor: text; color: inherit; }
.link-name:hover { background: #eef1f7; }
.ctl.rename { flex: 1; min-width: 0; font-weight: 600; }
.w-shape > .box { border-radius: 6px; }
.design .w-shape:not(.sel) { outline: none; }
.w-image > img { object-fit: contain; display: block; user-select: none; }

.pic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; margin-top: 4px; }
.pic { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 6px; display: grid; place-items: center; cursor: pointer; }
.pic img { max-width: 100%; max-height: 100%; object-fit: contain; }
.pic.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.pic.add { font-size: 11px; color: var(--muted); border-style: dashed; padding: 2px; }
.pic-row img { width: 28px; height: 28px; object-fit: contain; border-radius: 4px; background: #f4f5f8; }

.lst { overflow: auto; border: 1px solid #dfe3ec; border-radius: 10px; background: #fff; }
.lst-row { padding: 10px 12px; border-bottom: 1px solid #eef0f5; font-size: 15px; cursor: pointer; }
.lst-row:last-child { border-bottom: 0; }
.lst-row:hover { background: #f4f7fd; }
.lst-row.sel, .lst-row.sel:hover { background: #dce8fd; box-shadow: inset 3px 0 0 #2f6fdd; }
.lst-empty { padding: 12px; color: #98a0b0; font-size: 14px; }
.list-var { margin: 6px 0 10px; }
.list-start { width: 100%; font-size: 13px; }

/* web page (default) or phone stage, scaled to fit its column */
.stage-col { flex: 1 1 auto; min-width: 0; }
.view-design .props { flex: none; width: 320px; }
.view-run .run-side { flex: none; width: 380px; }
.stage-host { position: relative; }
.stage { transform-origin: top left; border-radius: 10px; }
.stage.phone { border-radius: 28px; }
.top .ctl.name { width: 180px; }
.top { flex-wrap: nowrap; overflow-x: auto; }

/* narrow windows, such as App Builder inside a lesson page (about 600-900 px wide) */
@media (min-width: 601px) and (max-width: 900px) {
  #app { grid-template-columns: 190px 1fr; }
  .side { padding: 6px 10px 16px; }
  .tabs { padding: 6px 10px 0; }
  .tab { padding: 8px 12px; }
}
@media (max-width: 900px) {
  .top { gap: 6px; padding: 6px 10px; }
  .top .tag:not(.lvl) { display: none; }
  .top .ctl.name { width: auto; flex: 1 1 90px; min-width: 70px; }
  .top select.ctl { max-width: 130px; }
  .view { padding: 12px; }
}
.sheet-bar { flex-wrap: wrap; }
.sheet-bar .hint { flex: 1 1 260px; }

/* live values beside the sidebar's variables while the app runs (Run tab or the Events preview) */
.now { display: none; flex: 0 1 auto; min-width: 2.5em; max-width: 9em; font: 600 12px/1.6 var(--mono, ui-monospace, monospace); color: var(--accent); background: var(--accent-soft, rgba(13,148,136,.12)); border-radius: 6px; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 9em; }
.ab-running .now { display: inline-block; }
.now:empty::before { content: '–'; color: var(--muted); }
.now.bump { animation: nowbump .6s ease-out; }
@keyframes nowbump { from { background: var(--accent); color: #fff; } }
.var-head { display: none; margin: 0 0 -2px; font-size: 11px; color: var(--muted); }
.ab-running .var-head { display: flex; }
.var-head .col-start { width: 72px; }
.var-head .col-now { flex: 0 1 auto; min-width: 2.5em; padding-left: 6px; color: var(--accent); font-weight: 600; }
.var-head .col-x { width: 22px; }
.run-screen { margin-left: auto; font-size: 12px; color: var(--muted); }
.ab-running .side .var .ctl.small { width: 52px; }
.ab-running .var-head .col-start { width: 52px; }
/* on the Run tab the object lists fold away so the variables are in view */
.ab-runtab .side .tree-children { display: none; }
.ab-running .side .var > .vname { flex: 0 0 auto; max-width: 6.5em; overflow: hidden; text-overflow: ellipsis; }
.ab-running .side .var > .now { flex: 1 1 auto; max-width: none; }
.ab-running .side .var-head > .col-now { flex: 1 1 auto; }
.ab-running .side .var-head > .vname { width: 6.5em; flex: 0 0 auto; }
.start-count { white-space: nowrap; }
.ab-running .side .var > .icon.danger, .ab-running .side .var-head > .col-x { display: none; }

/* ---- Tables (sidebar editor, live rows, the Table object) ---- */
.table-var { margin: 6px 0 14px; }
.tbl-edit { overflow-x: auto; border: 1px solid #dfe3ec; border-radius: 8px; background: #fff; }
.tbl-edit table, table.live { border-collapse: collapse; width: 100%; font-size: 13px; }
.tbl-edit th, .tbl-edit td { border-bottom: 1px solid #eef0f5; padding: 0; text-align: left; }
.tbl-edit th { background: #f6f7fb; font-weight: 600; white-space: nowrap; }
.tbl-edit th .fld { padding: 5px 6px; font: inherit; font-weight: 600; }
.tbl-edit .ftype { color: var(--muted, #8a93a6); font-weight: 400; font-size: 11px; }
.tbl-edit .rn, table.live .rn { color: var(--muted, #8a93a6); width: 1.8em; text-align: center; font-size: 11px; }
.tbl-edit .cell { border: 0; width: 100%; min-width: 5.5em; padding: 5px 6px; font: inherit; background: transparent; }
.tbl-edit .cell.num { text-align: right; min-width: 3.5em; }
.tbl-edit .cell:focus { outline: 2px solid var(--accent, #0d9488); outline-offset: -2px; background: #fff; }
.tbl-edit td .icon.danger { opacity: .35; }
.tbl-edit tr:hover .icon.danger, .tbl-edit tr:focus-within .icon.danger { opacity: 1; }
.tbl-edit .addf { width: 1.8em; }
.tbl-tools { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.btn.small { padding: 3px 9px; font-size: 13px; }
pre.json { max-height: 220px; overflow: auto; background: #f6f7fb; border: 1px solid #dfe3ec; border-radius: 8px; padding: 8px; font-size: 12px; margin: 6px 0; }
.tbl-live { display: none; }
.ab-running .tbl-live { display: block; }
.live-head { font-size: 12px; margin: 4px 0 2px; }
table.live { background: #fff; border: 1px solid #dfe3ec; }
table.live th, table.live td { border-bottom: 1px solid #eef0f5; padding: 3px 6px; text-align: left; }
table.live th { background: #f6f7fb; }
table.live td.chg { animation: nowbump .8s ease-out; background: var(--accent-soft, rgba(13,148,136,.12)); }
.icon.remember { opacity: .3; filter: grayscale(1); }
.icon.remember.on { opacity: 1; filter: none; }
.props fieldset.cols { border: 0; padding: 0; margin: 6px 0; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.props fieldset.cols legend { font-size: 13px; margin-bottom: 4px; padding: 0; }
.fields { display: inline-flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.field-box { display: inline-flex; align-items: center; gap: 2px; }
.field-name { font-style: italic; }
/* the Table object on the app */
.tbl { overflow: hidden; border: 1px solid #dfe3ec; border-radius: 10px; background: #fff; height: 100%; }
.tbl-scroll { overflow: auto; height: 100%; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 15px; }
.tbl th { position: sticky; top: 0; background: #f4f6fa; text-align: left; padding: 8px 10px; font-weight: 600; border-bottom: 1px solid #dfe3ec; }
.tbl td { padding: 8px 10px; border-bottom: 1px solid #eef0f5; }
.tbl .tbl-row { cursor: pointer; }
.tbl .tbl-row:hover td { background: #f4f7fd; }
.tbl .tbl-row.sel td { background: #dce8fd; }
.tbl .tbl-row.sel td:first-child { box-shadow: inset 3px 0 0 #2f6fdd; }

.paste-box { width: 100%; font: 13px/1.4 ui-monospace, Menlo, monospace; resize: vertical; }

/* Sound and Video objects */
.w-sound { display: flex; }
.snd { display: flex; align-items: center; gap: 10px; width: 100%; height: 100%; padding: 6px 10px; border: 1px solid #dfe3ec; border-radius: 12px; background: #fff; box-sizing: border-box; overflow: hidden; }
.snd.on { border-color: #2f6fdd; background: #f2f6fe; }
.snd-btn { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; background: #2f6fdd; color: #fff; font-size: 15px; cursor: pointer; display: grid; place-items: center; }
.snd-btn:disabled { cursor: default; opacity: .85; }
.snd-txt { min-width: 0; }
.snd-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.snd-credit { font-size: 11px; color: #7a8294; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.snd audio { display: none; }
.vid { width: 100%; height: 100%; display: flex; flex-direction: column; background: #111; border-radius: 10px; overflow: hidden; }
.vid video, .vid iframe { flex: 1; min-height: 0; width: 100%; border: 0; background: #000; }
.vid-credit { font-size: 11px; color: #cfd4de; padding: 3px 8px; background: #1b1d22; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vid-credit a { color: #9cc0ff; }
.vid-ph { flex: 1; display: grid; place-content: center; text-align: center; gap: 6px; color: #cfd4de; font-size: 13px; padding: 10px; }
.vid-big { font-size: 34px; }
p.small, .muted.small { font-size: 12px; }

/* linked fields and the nested view */
.tbl-edit select.cell.link { width: 100%; font: inherit; font-size: 13px; border: 1px solid transparent; background: #f6f8fd; border-radius: 4px; padding: 2px; }
.tbl-edit select.cell.link.broken { background: #fdecec; color: #b3261e; border-color: #f0b4b0; }
.json-nest { display: flex; align-items: center; gap: 6px; font-size: 13px; margin: 6px 0; }
.json-nest select { flex: 1; min-width: 0; font-size: 13px; }
.json-wrap > .btn { margin-top: 4px; }

/* map tab */
.view-map { display: flex; flex-direction: column; gap: 10px; }
.map-bar .hint { margin-bottom: 8px; }
.map-tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.map-problems { margin: 8px 0 0; padding-left: 20px; color: var(--trig); font-size: 13px; }
.map-board { position: relative; display: flex; gap: 130px; align-items: flex-start; padding: 16px 8px 110px; min-width: min-content; }
.map-arrows { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.map-link path { fill: none; stroke: #8a93a8; stroke-width: 1.8; }
.map-head { fill: #8a93a8; }
.map-labels { z-index: 2; }
.map-label { font-size: 11px; fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
.map-col { display: flex; flex-direction: column; gap: 40px; position: relative; z-index: 1; }
.map-col.none { padding-left: 24px; border-left: 2px dashed var(--line); }
.map-col-head { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: -28px; }
.map-card { width: 190px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; box-shadow: 0 4px 14px rgba(20, 30, 60, .07); }
.map-card.current { border-color: var(--accent); }
.map-card.unreached { border-style: dashed; }
.map-card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
.map-flag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; }
.map-flag.start { background: var(--accent-soft); color: var(--accent); }
.map-flag.warn { background: var(--trig-soft); color: var(--trig); }
.map-thumb { display: flex; justify-content: center; width: 100%; border: 0; padding: 4px 0; background: none; border-radius: 8px; cursor: pointer; }
.map-thumb:hover { background: #f0f2f7; }
.map-thumb:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.map-thumb-stage .stage { pointer-events: none; box-shadow: none; }
.map-ways { list-style: none; margin: 8px 0 0; padding: 0; font-size: 12px; display: flex; flex-direction: column; gap: 3px; }

/* functions (core/functions.js): side panel rows and the name line above a function's sheet */
.tree-node.fns { margin-top: 4px; }
.fns-head .fns-title { font-weight: 600; color: var(--muted); }
.fns-head .kind { margin-left: 8px; }
.tree-row.fn { padding: 3px 0; }
.tree-row.fn .link { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
.tree-row.fn.on .link { font-weight: 600; color: var(--accent); }
.fn-bar { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-bottom: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fafbfd; }
.fn-bar[hidden] { display: none; }
.fn-sig { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; font-family: ui-monospace, Menlo, Consolas, monospace; }
.fn-sig .fn-name { font-size: 15px; }
.param-chip { display: inline-flex; align-items: center; gap: 2px; padding: 1px 4px 1px 8px; border: 1px solid var(--line); border-radius: 99px; background: #fff; }
.param-chip .link-name { font-family: inherit; }
.fn-sig .ctl.rename { width: 9em; }
.ev.seq .badge.when-called { white-space: nowrap; }
.fn-extras { display: flex; flex-wrap: wrap; gap: 6px; }
.fn-extra { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; font: inherit; font-size: 12px; color: var(--muted); background: transparent; border: 1px dashed var(--line); border-radius: 99px; cursor: pointer; }
.fn-extra:hover, .fn-extra:focus-visible { color: var(--ink); border-style: solid; }
.fn-extra.check.on { color: var(--accent); border-style: solid; border-color: var(--accent); }
.fn-extra.check input { margin: 0; }

/* Drawing and Photo (ROADMAP §10) */
.drw { position: relative; width: 100%; height: 100%; background: #fff; border: 1px solid #d0d5dd; border-radius: 8px; overflow: hidden; }
.drw canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.drw-hint { position: absolute; inset: 0; display: grid; place-items: center; color: #98a2b3; font-size: 14px; pointer-events: none; }
.pho { position: relative; width: 100%; height: 100%; background: #1d2433; border-radius: 10px; overflow: hidden; cursor: pointer; }
.pho video { width: 100%; height: 100%; object-fit: cover; display: block; }
.pho-msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 12px; text-align: center; color: #e4e7ec; font-size: 14px; line-height: 1.4; }
.pho.live .pho-msg { display: none; }
.pho.flash::after { content: ''; position: absolute; inset: 0; background: #fff; animation: pho-flash .35s ease-out forwards; pointer-events: none; }
@keyframes pho-flash { from { opacity: .85; } to { opacity: 0; } }
.cell-pic { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; vertical-align: middle; background: #f2f4f7; }
.cell-pic-pick { display: inline-flex; align-items: center; gap: 4px; }
.cell-pic-pick .cell-pic { width: 26px; height: 26px; }
/* Recorder (ROADMAP §10 step 3) */
.rec { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 6px; justify-content: center; padding: 8px 10px; background: #f8f9fb; border: 1px solid #d0d5dd; border-radius: 10px; box-sizing: border-box; }
.rec-row { display: flex; align-items: center; gap: 8px; }
.rec-btn, .rec-play { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #d0d5dd; background: #fff; font-size: 16px; cursor: pointer; flex: none; }
.rec-btn { color: #d92d20; }
.rec.on .rec-btn { background: #d92d20; color: #fff; }
.rec-msg { font-size: 13px; line-height: 1.3; color: #344054; }
.rec-trim { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #667085; }
.rec-trim input { flex: 1; min-width: 0; }
.cell-snd { font-size: 13px; white-space: nowrap; }

/* ======================================================================================================
   Look (26 Nov 2026, Matthew picked direction "B": a classroom tool). App Builder's own look: one strong blue,
   white rounded panels on a light grey, amber "when" blocks with a bolt and blue "do" blocks with an arrow,
   so an event reads at a glance; clear on a projector. Layout and data-ab labels are unchanged (lesson clips
   click them). Everything below overrides the rules above.
   ====================================================================================================== */
:root {
  --bg: #eef1f7; --panel: #fff; --line: #dde2ec; --line-strong: #c7cfdd; --ink: #172033; --muted: #5d6779;
  --accent: #1f5fd6; --accent-ink: #fff; --accent-soft: #e8f0fe; --accent-dark: #174bb0;
  --trig: #b56a00; --trig-soft: #fff4d6; --trig-line: #f0a500;
  --do-soft: #eaf1ff; --do-line: #1f5fd6;
  --radius: 10px; --shadow-sm: 0 1px 2px rgba(16, 24, 40, .06); --shadow: 0 2px 8px rgba(16, 24, 40, .08);
}
#app { gap: 8px; padding: 0 8px 8px; }
@media (min-width: 901px) { #app { grid-template-columns: 250px 1fr; } }

/* the brand bar: grouped tools on blue */
.top { margin: 0 -8px; padding: 8px 14px; gap: 6px; background: var(--accent); color: #fff; border: 0; min-height: 56px; }
.top .brand { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; color: #fff; margin-right: 4px; }
.top .logo { width: 24px; height: 24px; border-radius: 6px; background: #fff; display: grid; place-items: center; color: var(--accent); font-size: 14px; }
.top .tag { background: rgba(255, 255, 255, .2); color: #fff; }
.top .ctl.name { background: rgba(255, 255, 255, .16); border: 1px solid transparent; color: #fff; font-weight: 600; min-width: 150px; }
.top .ctl.name:hover { background: rgba(255, 255, 255, .24); }
.top .ctl.name:focus { background: #fff; color: var(--ink); outline: none; }
.top .grp { display: flex; align-items: center; gap: 2px; padding-left: 8px; margin-left: 4px; border-left: 1px solid rgba(255, 255, 255, .28); }
.top .btn { background: transparent; border: 1px solid transparent; color: #fff; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; }
.top .btn svg { width: 16px; height: 16px; flex: none; }
.top .btn:hover:not(:disabled) { background: rgba(255, 255, 255, .16); }
.top .btn:disabled { opacity: .45; }
.top .btn.primary { background: #fff; color: var(--accent); font-weight: 600; border-color: #fff; }
.top .btn.primary:hover { background: #eef3fe; }
.top select.ctl { background: rgba(255, 255, 255, .16); color: #fff; border: 1px solid transparent; max-width: 190px; }
.top select.ctl:hover { background: rgba(255, 255, 255, .24); }
.top select.ctl option { color: var(--ink); background: #fff; }
.top .sep { display: none; }
.top :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

/* panels: the project sidebar and the work area are white cards with a title bar */
.side { border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 0 12px 16px; }
.side > h3:first-child { margin: 0 -12px 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13.5px; letter-spacing: 0; text-transform: none; color: var(--ink); background: #fff; position: sticky; top: 0; z-index: 2; border-radius: var(--radius) var(--radius) 0 0; }
.side h3 { color: var(--muted); font-size: 11.5px; margin: 16px 0 6px; padding-top: 10px; border-top: 1px solid var(--line); }
.main { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }
.tabs { padding: 6px 10px; gap: 4px; align-items: center; border-bottom: 1px solid var(--line); background: #fff; }
.tab { border: 0; border-radius: 99px; padding: 6px 16px; color: #475467; }
.tab:hover { background: #f2f5fa; color: var(--ink); }
.tab.on { background: var(--accent-soft); color: var(--accent); border: 0; }
.view { background: #f7f9fc; }

/* the side tree */
.tree-row.on, .tree-row.obj.on, .tree-row.sel { background: var(--accent-soft); }
.tree-row.sel .obj-name, .tree-row.on .obj-name { color: var(--accent); font-weight: 600; }

/* cards inside views (properties, run bar) */
.props, .card { border-color: var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); }

/* the event sheet: one white sheet, a row per event, numbered; amber = when, blue = do */
.es { counter-reset: ev; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }
.es:has(> .es-empty:only-child) { border: 0; box-shadow: none; background: none; }
.es > .ev, .es .ev { margin: 0; border: 0; border-radius: 0; border-bottom: 1px solid var(--line); background: #fff; position: relative; }
.es > .ev { counter-increment: ev; padding-left: 34px; }
.es > .ev::before { content: counter(ev); position: absolute; left: 0; top: 0; bottom: 0; width: 34px; padding-top: 13px; text-align: center; font-size: 12px; color: #98a2b3; background: #f7f9fc; border-right: 1px solid var(--line); }
.es .ev:last-of-type { border-bottom: 0; }
.es.guided .ev { border: 0; border-bottom: 1px solid var(--line); }
.es.guided .ev:hover { background: #fafbfe; border-color: var(--line); }
.es.guided .ev.sel { background: #f3f7ff; box-shadow: inset 3px 0 var(--accent); border-color: var(--line); }
.es > .ev.sel::before { color: var(--accent); font-weight: 700; background: var(--accent-soft); }
.es .ev.ran, .es.guided .ev.ran { background: var(--ok); }
.ev-main { padding: 8px 10px; gap: 12px; }
.ev-conds { border-right: 2px solid #eef1f6; padding-right: 10px; }
.item.cond.trig, button.item.guided.cond, .item.cond { margin-left: 0; }
button.item.guided { border-radius: 6px; padding: 5px 10px; }
button.item.guided.cond { background: var(--trig-soft); border-left: 3px solid var(--trig-line); }
button.item.guided.act { background: var(--do-soft); border-left: 3px solid var(--do-line); }
button.item.guided.cond:hover { border-color: var(--trig-line); }
button.item.guided.act:hover { border-color: var(--do-line); }
button.item.guided.act::before { content: '\2192'; color: var(--do-line); font-weight: 700; margin-right: 2px; }
button.item.guided .val { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
.item.cond.trig:not(.guided) { background: var(--trig-soft); border-left: 3px solid var(--trig-line); border-radius: 6px; margin-left: 0; }
.bolt { color: var(--trig); }
.ev.else { box-shadow: inset 3px 0 var(--else); }
.ev-children { margin: 0 10px 8px 22px; border-left: 2px solid #e4e8f0; }
.ev-children .ev { border-bottom: 1px dashed var(--line); }
.mini { border-style: dashed; border-color: #c3cad8; color: var(--accent); font-weight: 600; border-radius: 99px; }
.mini:hover { background: var(--accent-soft); border-color: var(--accent); }
.es-addev { margin-top: 10px; }
.es-addev .btn, .btn.add-event { color: var(--accent); font-weight: 600; }

/* buttons and boxes in the work area */
.btn { border-color: var(--line-strong); border-radius: 8px; }
.btn:hover:not(:disabled) { background: #f2f5fa; }
.btn.primary { background: var(--accent); border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-dark); }
.seg.on { background: var(--accent); border-color: var(--accent); }
.ctl:focus, input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }

/* the stage */
.stage { box-shadow: 0 4px 14px rgba(16, 24, 40, .12); border-radius: 12px; }

/* dialogs: a title bar like the panels */
.es-dlg { border-radius: 14px; border: 1px solid var(--line); box-shadow: 0 16px 40px rgba(16, 24, 40, .22); }
.es-dlg .dlg-head { background: #fff; border-bottom: 1px solid var(--line); }
.es-dlg .dlg-foot { background: #f7f9fc; border-top: 1px solid var(--line); }
.op-tile:hover { border-color: var(--accent); background: var(--accent-soft); }

/* narrow windows (a lesson page): less frame */
@media (max-width: 900px) {
  #app { padding: 0 4px 4px; gap: 4px; }
  .top { margin: 0 -4px; }
  .top .btn .lbl-wide { display: none; }
}
.top .brand { white-space: nowrap; }
/* read-only sheets (Run tab) and quick edit: the same amber/blue blocks, and text wraps instead of being cut */
.es .ev-main { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) auto; }
.ro .ev-main { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); }
.es .item { min-width: 0; overflow-wrap: break-word; }
.es:not(.guided) .item.act { background: var(--do-soft); border-left: 3px solid var(--do-line); border-radius: 6px; padding: 3px 8px; }
.es:not(.guided) .item.cond { background: #f4f6fa; border-left: 3px solid #c3cad8; border-radius: 6px; padding: 3px 8px; }
.es:not(.guided) .item.cond.trig { background: var(--trig-soft); border-left-color: var(--trig-line); }
/* + Add event: the sheet's last row */
.es-addev { margin-top: 0; }
.es > .es-addev { display: block; width: 100%; border: 0; border-radius: 0; text-align: left; padding: 10px 12px 10px 46px; background: #fff; color: var(--accent); font-weight: 600; }
.es > .es-addev:hover:not(:disabled) { background: var(--accent-soft); }

/* the bar keeps to one line (it scrolls sideways if it must): Undo and Redo are icons, the tag shows on wide screens */
.top .btn.icon-only { padding: 6px 8px; }
.top .btn.icon-only .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 1500px) { .top .tag:not(.lvl) { display: none; } }
.top select.ctl { max-width: 170px; }
@media (max-width: 1200px) { .top select.ctl { max-width: 130px; } .top .btn:not(.primary):not(.icon-only) svg { display: none; } }

.rec-trim[hidden] { display: none; }

.pho-shutter { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); width: 48px; height: 48px; border-radius: 50%; border: 4px solid rgba(255, 255, 255, .85); background: #fff; box-shadow: 0 0 0 2px rgba(0, 0, 0, .25); cursor: pointer; padding: 0; }
.pho-shutter:hover { background: #f2f4f7; }
.pho-shutter:active { transform: translateX(-50%) scale(.94); }
.pho-shutter[hidden] { display: none; }
.tab.stop.on { background: #fde8e7; color: #b42318; }
.pic-row .snd-ico { width: 28px; text-align: center; font-size: 16px; flex: none; }
.side .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
.top .btn.save-as { margin-left: -4px; padding: 6px 6px; color: #fff; }

/* share by link, and the play-only page a link opens */
.share-link { width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; margin: 6px 0; }
#app.play-page { display: flex; flex-direction: column; height: 100vh; padding: 0; gap: 0; }
.play-bar { margin: 0; flex: none; }
.play-made { font-size: 12px; opacity: .8; margin-left: 4px; }
.play-bar a.btn { text-decoration: none; }
.play-bar .btn:not(.primary) { color: #fff; }
.play-stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; overflow: auto; background: var(--bg); min-width: 0; }
.play-error { max-width: 480px; margin: 80px auto; text-align: center; }

/* guided tutorial (ui/tutorial-panel.js): only when a tutorial link opens it */
.tut { position: fixed; right: 16px; bottom: 16px; width: 360px; max-height: min(70vh, 560px); display: flex; flex-direction: column; background: #fff; border: 1px solid var(--line); border-top: 4px solid #f59e0b; border-radius: 12px; box-shadow: 0 12px 32px rgba(16, 24, 40, .22); z-index: 30; font-size: 14px; }
.tut.left { right: auto; left: 16px; }
.tut[hidden], .tut-reopen[hidden] { display: none; }
.tut-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--line); }
.tut-count { font-weight: 700; font-size: 12px; color: #b45309; white-space: nowrap; }
.tut-name { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tut-main { padding: 10px 14px 12px; overflow-y: auto; }
.tut-part { margin: 0; font-size: 12px; color: var(--muted); }
.tut-title { font-size: 16px; margin: 2px 0 8px; }
.tut-dots { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
.tut-dot { width: 14px; height: 14px; padding: 0; border-radius: 99px; border: 2px solid #d4d8e1; background: #fff; }
.tut-dot.done { background: #16a34a; border-color: #16a34a; }
.tut-dot.on { outline: 2px solid #f59e0b; outline-offset: 1px; }
.tut-body p { margin: 0 0 8px; line-height: 1.45; }
.tut-body ol, .tut-body ul { margin: 0 0 8px; padding-left: 20px; line-height: 1.45; }
.tut-body li { margin-bottom: 4px; }
.tut-body code { background: #f1f3f7; border-radius: 4px; padding: 0 4px; font-size: 13px; }
.tut-check { margin: 8px 0; padding: 8px 10px; border-radius: 8px; background: #f6f7fa; color: var(--muted); font-size: 13px; }
.tut-check.ok { background: var(--ok); color: #14532d; font-weight: 600; }
.tut-nav { display: flex; gap: 8px; margin-top: 6px; }
.tut-nav .btn.primary { background: #16a34a; border-color: #16a34a; }
.tut.small .tut-main > :not(.tut-title):not(.tut-nav) { display: none; }
.tut.small .tut-title { font-size: 14px; margin: 0 0 6px; }
.tut-reopen { position: fixed; right: 16px; bottom: 16px; z-index: 30; box-shadow: 0 6px 18px rgba(16, 24, 40, .18); border-color: #f59e0b; }
.tut-ring { position: fixed; pointer-events: none; z-index: 1001; border: 3px solid #f59e0b; border-radius: 10px; box-shadow: 0 0 0 4px rgba(245, 158, 11, .25); animation: tut-pulse 1.4s ease-in-out infinite; transition: left .15s, top .15s, width .15s, height .15s; }
.tut-bubble { position: fixed; pointer-events: none; z-index: 1001; max-width: 260px; background: #1c2333; color: #fff; font-size: 13px; line-height: 1.35; padding: 7px 10px; border-radius: 8px; box-shadow: 0 6px 18px rgba(0, 0, 0, .2); }
.tut-bubble[hidden] { display: none; }
@keyframes tut-pulse { 50% { box-shadow: 0 0 0 9px rgba(245, 158, 11, .12); } }
@media (prefers-reduced-motion: reduce) { .tut-ring { animation: none; transition: none; } }
@media (max-width: 700px) {
  .tut, .tut.left { left: 0; right: 0; bottom: 0; width: auto; max-height: 55vh; border-radius: 12px 12px 0 0; }
  .tut-reopen { right: 10px; bottom: 10px; }
  .tut [data-ab='tutorial-side'] { display: none; }
}
</style>
